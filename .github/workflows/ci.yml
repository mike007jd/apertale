name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Private same-repository changes use the isolated gmk runner. Public
    # repositories, including fork PRs, use a fresh GitHub-hosted VM so
    # untrusted code never reaches persistent infrastructure.
    if: >-
      !github.event.repository.private ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.event.repository.private && 'gmk-ci' || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify release
        run: npm run verify:release
      - name: Audit locked dependencies
        run: npm audit --package-lock-only --audit-level=high
